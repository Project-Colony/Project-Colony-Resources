[package]
name = "colony-ui"
version = "0.1.6"
description = "Shared iced theme, palettes, fonts, labels and preferences kit for Project Colony programs"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["iced", "gui", "theme", "palette", "colony"]
categories = ["gui"]

[features]
default = ["fonts"]
# Embeds the three Colony font families (about 8 MB of TTF/OTF, see fonts/) so a
# program registers them with iced from `colony_ui::fonts::BYTES`. Without it,
# the family names and the accessors are still here and the program ships the
# files itself. Unused bytes do not reach a binary either way: the linker drops
# them.
fonts = []

[dependencies]
dirs.workspace = true
iced.workspace = true
serde.workspace = true
serde_json.workspace = true

[[example]]
name = "preferences"
required-features = ["fonts"]
