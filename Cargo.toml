[workspace]
resolver = "2"
members = ["crates/colony-ui", "tools/colony-tokens"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Project-Colony-Resources"
# Matches Colony's floor so anything published from here stays consumable by it.
rust-version = "1.80"

[workspace.dependencies]
# Pinned to the current release, not a floating minor. Staleness has to be
# visible here, in the manifest, rather than hidden in the lockfile — see
# design/dependencies.md.
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.4"

# The shared UI baseline. Declared here so every Colony program that depends on
# colony-ui inherits the same iced, instead of each repo drifting on its own —
# which is how D1Gg2r ended up on 0.13 while everything else moved to 0.14.
iced = "0.14.0"

# Platform-standard directories. The Colony filesystem layout is defined on top
# of it in colony-ui's `paths` module — see design/filesystem.md.
dirs = "6.0.0"
