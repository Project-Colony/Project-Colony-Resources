# Shared interface labels - Project Colony
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.
#
# These are the strings of the Preferences skeleton that every Colony program
# shares: the page title, the three mandatory categories, and every Appearance
# and Accessibility control colony-ui draws. A program's own vocabulary (its
# Storage category, its Startup section) stays in the program.
#
# English is the canonical string and is written first; the French is a
# translation of it. Both are required. Key naming follows design/i18n.md:
# settings_cat_<category>, settings_section_<section>, settings_<name> and
# settings_<name>_desc for a control and its description.
#
# The user-facing word is "Preferences", never "Settings" (design/navigation.md).
# The `settings_` prefix is the key convention, not something a user reads.

