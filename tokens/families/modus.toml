# Modus — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "modus"
order = 24
label_key = "settings_theme_modus"
icon = "f06e"  # Nerd Font codepoint

[label]
fr = "Modus"
en = "Modus"

[[variants]]
key = "operandi"
const = "MODUS_OPERANDI"  # Rust const name, kept stable for Colony
label_key = "settings_theme_modus_operandi"
mode = "light"

[variants.label]
fr = "Operandi"
en = "Operandi"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#ffffff"
accent = "#0031a9"

[variants.palette]
# backgrounds
bg_primary = "#ffffff"
bg_sidebar = "#f0f0f0"
bg_card = "#e0e0e0"
bg_card_hover = "#d0d0d0"
bg_card_pressed = "#c4c4c4"
bg_selected = "#d0d0d0"
bg_input = "#e0e0e0"
bg_progress = "#f0f0f0"

# text
text_primary = "#000000"
text_secondary = "#1a1a1a"
text_muted = "#333333"
text_dim = "#595959"
text_dimmer = "#7f7f7f"
text_dimmest = "#9f9f9f"
text_placeholder = "#7f7f7f"

# accent
accent_blue = "#0031a9"
accent_icon = "#005e8b"
accent_progress = "#0031a9"

# buttons
btn_default = "#e0e0e0"
btn_hover = "#d0d0d0"
btn_pressed = "#c4c4c4"

# success
success = "#006800"
success_bg = "#d0f0d0"
btn_success = "#006800"
btn_success_hover = "#005800"
btn_success_pressed = "#004800"

# warning
warning = "#6f5500"
warning_bg = "#f0e8c8"

# error
error = "#a60000"
error_light = "#d00000"
error_bg = "#f0c8c8"
btn_danger_bg = "#f0c8c8"
btn_danger_hover = "#e0b0b0"
btn_trash_hover = "#a60000"
btn_trash_pressed = "#860000"

# modal
bg_modal_section = "#ffffff"
border_subtle = "#d0d0d0"
divider = "#d0d0d0"

[[variants]]
