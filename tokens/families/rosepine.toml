# Rosé Pine — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "rosepine"
order = 9
label_key = "settings_theme_rosepine"
icon = "f46d"  # Nerd Font codepoint

[label]
fr = "Rosé Pine"
en = "Rosé Pine"

[[variants]]
key = "main"
const = "ROSEPINE_MAIN"  # Rust const name, kept stable for Colony
label_key = "settings_theme_rosepine_main"
mode = "dark"

[variants.label]
fr = "Principal"
en = "Main"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#191724"
accent = "#9ccfd8"

[variants.palette]
# backgrounds
bg_primary = "#191724"
bg_sidebar = "#1f1d2e"
bg_card = "#26233a"
