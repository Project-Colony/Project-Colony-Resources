# Catppuccin — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "catppuccin"
order = 1
label_key = "settings_theme_catppuccin"
icon = "f0f4"  # Nerd Font codepoint

[label]
fr = "Catppuccin"
en = "Catppuccin"

[[variants]]
key = "latte"
const = "CATPPUCCIN_LATTE"  # Rust const name, kept stable for Colony
label_key = "settings_theme_catppuccin_latte"
mode = "light"

[variants.label]
fr = "Latte"
en = "Latte"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#eff1f5"
accent = "#1e66f5"

[variants.palette]
# backgrounds
bg_primary = "#eff1f5"
bg_sidebar = "#e6e9ef"
bg_card = "#e6e9ef"
bg_card_hover = "#dce0e8"
bg_card_pressed = "#ccd0da"
bg_selected = "#ccd0da"
bg_input = "#dce0e8"
bg_progress = "#dce0e8"

# text
text_primary = "#4c4f69"
text_secondary = "#5c5f77"
text_muted = "#6c6f85"
text_dim = "#7c7f93"
text_dimmer = "#8c8fa1"
text_dimmest = "#9ca0b0"
text_placeholder = "#8c8fa1"

# accent
accent_blue = "#1e66f5"
accent_icon = "#7287fd"
accent_progress = "#7287fd"

# buttons
btn_default = "#dce0e8"
btn_hover = "#ccd0da"
btn_pressed = "#bcc0cc"

# success
success = "#40a02b"
success_bg = "#d5f0cd"
btn_success = "#40a02b"
btn_success_hover = "#369222"
btn_success_pressed = "#2c8219"

# warning
warning = "#df8e1d"
warning_bg = "#f5e6c8"

# error
error = "#d20f39"
error_light = "#e64553"
error_bg = "#f5d0d6"
btn_danger_bg = "#f5d0d6"
btn_danger_hover = "#eab0ba"
btn_trash_hover = "#d20f39"
btn_trash_pressed = "#b00c30"

# modal
bg_modal_section = "#e6e9ef"
border_subtle = "#ccd0da"
divider = "#ccd0da"

