# Ayu — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "ayu"
order = 12
label_key = "settings_theme_ayu"
icon = "f06c0"  # Nerd Font codepoint

[label]
fr = "Ayu"
en = "Ayu"

[[variants]]
key = "dark"
const = "AYU_DARK"  # Rust const name, kept stable for Colony
label_key = "settings_theme_dark_mode"
mode = "dark"

[variants.label]
fr = "Mode sombre"
en = "Dark mode"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#0b0e14"
accent = "#e6b450"

[variants.palette]
# backgrounds
bg_primary = "#0b0e14"
bg_sidebar = "#070a10"
bg_card = "#1b2028"
bg_card_hover = "#252b35"
bg_card_pressed = "#303842"
bg_selected = "#1b3a4b"
bg_input = "#1b2028"
bg_progress = "#070a10"

# text
text_primary = "#bfbdb6"
text_secondary = "#a8a6a0"
text_muted = "#8a8880"
text_dim = "#7a786e"
text_dimmer = "#626a73"
text_dimmest = "#4a505a"
text_placeholder = "#626a73"

# accent
accent_blue = "#e6b450"
accent_icon = "#59c2ff"
accent_progress = "#e6b450"

# buttons
btn_default = "#1b2028"
btn_hover = "#252b35"
btn_pressed = "#303842"

# success
success = "#aad94c"
success_bg = "#0c1a10"
btn_success = "#88b040"
btn_success_hover = "#7ca436"
btn_success_pressed = "#70982c"

# warning
