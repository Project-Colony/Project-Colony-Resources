error_bg = "#1a0c0c"
btn_danger_bg = "#1a0c0c"
btn_danger_hover = "#2a1c1c"
btn_trash_hover = "#d95757"
btn_trash_pressed = "#b94848"

# modal
bg_modal_section = "#0b0e14"
border_subtle = "#1b2028"
divider = "#1b2028"

