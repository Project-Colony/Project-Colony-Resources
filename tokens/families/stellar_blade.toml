# Stellar Blade — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "stellar_blade"
order = 25
label_key = "settings_theme_stellar_blade"
icon = "f04e5"  # Nerd Font codepoint

notes = """
Fan-made and unofficial. No official colour codes exist for these
characters; every hex is derived from screenshots the user provided (hair,
suit, glow, material). Palettes are not copyrightable and no game art ships
with this set. Adam and Roxanne are still pending reference images.
"""

[label]
fr = "Stellar Blade"
en = "Stellar Blade"

[[variants]]
key = "eve"
const = "STELLAR_EVE"  # Rust const name, kept stable for Colony
label_key = "settings_theme_stellar_blade_eve"
mode = "light"
notes = """
Green ink on white-grey ceramic — her Planet Diving Suit. A light theme on
purpose: a dark theme can never say "white".
"""

[variants.label]
fr = "EVE"
en = "EVE"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#eceeec"
accent = "#21a04d"

[variants.palette]
# backgrounds
bg_primary = "#eceeec"
bg_sidebar = "#d3d7d3"
bg_card = "#ffffff"
bg_card_hover = "#e2e6e2"
bg_card_pressed = "#d7dcd7"
bg_selected = "#d9e4da"
bg_input = "#e0e4e0"
bg_progress = "#dee1de"

# text
text_primary = "#1a6b3b"
text_secondary = "#2b7d4a"
text_muted = "#4e8a63"
text_dim = "#6fa082"
text_dimmer = "#84ad94"
text_dimmest = "#9abda7"
text_placeholder = "#84ad94"

# accent
accent_blue = "#21a04d"
accent_icon = "#21a04d"
accent_progress = "#21a04d"

# buttons
btn_default = "#dfe3df"
btn_hover = "#d2d8d3"
btn_pressed = "#c5cdc7"

# success
success = "#2f9e5c"
success_bg = "#d3ecd9"
btn_success = "#2f9e5c"
btn_success_hover = "#288b50"
btn_success_pressed = "#227a46"

# warning
