# Flexoki — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "flexoki"
order = 15
label_key = "settings_theme_flexoki"
icon = "f02d"  # Nerd Font codepoint

[label]
fr = "Flexoki"
en = "Flexoki"

[[variants]]
key = "dark"
const = "FLEXOKI_DARK"  # Rust const name, kept stable for Colony
label_key = "settings_theme_dark_mode"
mode = "dark"

[variants.label]
fr = "Mode sombre"
en = "Dark mode"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#100f0f"
accent = "#4385be"

[variants.palette]
# backgrounds
bg_primary = "#100f0f"
bg_sidebar = "#1c1b1a"
bg_card = "#282726"
bg_card_hover = "#343331"
bg_card_pressed = "#403e3c"
bg_selected = "#403e3c"
bg_input = "#282726"
bg_progress = "#1c1b1a"

# text
text_primary = "#cecdc3"
text_secondary = "#b7b5ac"
text_muted = "#9f9d96"
text_dim = "#878580"
text_dimmer = "#6f6e69"
text_dimmest = "#575653"
text_placeholder = "#6f6e69"

# accent
accent_blue = "#4385be"
accent_icon = "#da702c"
accent_progress = "#4385be"

# buttons
btn_default = "#282726"
btn_hover = "#343331"
btn_pressed = "#403e3c"

# success
success = "#879a39"
success_bg = "#141a10"
btn_success = "#6e8030"
btn_success_hover = "#627428"
btn_success_pressed = "#566820"

# warning
warning = "#d0a215"
warning_bg = "#1e1a0c"

# error
error = "#d14d41"
error_light = "#e06858"
error_bg = "#1e100c"
btn_danger_bg = "#1e100c"
btn_danger_hover = "#3e201c"
btn_trash_hover = "#d14d41"
btn_trash_pressed = "#b13830"

# modal
bg_modal_section = "#100f0f"
border_subtle = "#282726"
divider = "#282726"

[[variants]]
key = "light"
const = "FLEXOKI_LIGHT"  # Rust const name, kept stable for Colony
label_key = "settings_theme_light"
