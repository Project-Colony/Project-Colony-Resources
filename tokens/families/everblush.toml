text_secondary = "#c4c4c4"
text_muted = "#b3b9b8"
text_dim = "#9aa0a0"
text_dimmer = "#808888"
text_dimmest = "#667070"
text_placeholder = "#808888"

# accent
accent_blue = "#67b0e8"
accent_icon = "#67b0e8"
accent_progress = "#67b0e8"

# buttons
btn_default = "#232a2d"
btn_hover = "#2c3538"
btn_pressed = "#354043"

# success
success = "#8ccf7e"
success_bg = "#1a2e1e"
btn_success = "#5aaa50"
