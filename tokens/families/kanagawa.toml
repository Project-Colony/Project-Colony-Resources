# Kanagawa — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "kanagawa"
order = 4
label_key = "settings_theme_kanagawa"
icon = "f073e"  # Nerd Font codepoint

[label]
fr = "Kanagawa"
en = "Kanagawa"

[[variants]]
key = "light"
const = "KANAGAWA_LOTUS"  # Rust const name, kept stable for Colony
label_key = "settings_theme_light"
mode = "light"

[variants.label]
fr = "Mode clair"
en = "Light mode"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#f2ecbc"
accent = "#4d699b"

[variants.palette]
# backgrounds
bg_primary = "#f2ecbc"
bg_sidebar = "#e5ddb0"
bg_card = "#e7dba0"
bg_card_hover = "#d5cea3"
bg_card_pressed = "#c8c093"
bg_selected = "#d5cea3"
bg_input = "#e4d794"
bg_progress = "#e5ddb0"

# text
text_primary = "#545464"
text_secondary = "#43436c"
text_muted = "#716e61"
text_dim = "#8a8980"
text_dimmer = "#a09cac"
text_dimmest = "#b0acb8"
text_placeholder = "#8a8980"

# accent
accent_blue = "#4d699b"
accent_icon = "#5d57a3"
accent_progress = "#5d57a3"

# buttons
btn_default = "#e7dba0"
btn_hover = "#d5cea3"
btn_pressed = "#c8c093"

# success
success = "#6f894e"
success_bg = "#b7d0ae"
btn_success = "#6e915f"
btn_success_hover = "#608554"
btn_success_pressed = "#527949"

# warning
warning = "#de9800"
warning_bg = "#f9d791"

# error
error = "#c84053"
error_light = "#d7474b"
error_bg = "#d9a594"
btn_danger_bg = "#d9a594"
btn_danger_hover = "#c89484"
btn_trash_hover = "#c84053"
btn_trash_pressed = "#a83043"

# modal
bg_modal_section = "#f2ecbc"
border_subtle = "#d5cea3"
divider = "#d5cea3"

