[[variants]]
key = "dragon"
# The journal variant above already holds KANAGAWA_DRAGON: Colony derived its
# parchment theme from Dragon and the const name is pinned by the import
# snapshot. So upstream's actual Dragon takes the suffixed name.
const = "KANAGAWA_DRAGON_DARK"
label_key = "settings_theme_kanagawa_dragon"
mode = "dark"
notes = """
Upstream Kanagawa Dragon, the low-contrast charcoal counterpart to Wave.
Values come from the theme's own dragonBlack/dragonWhite ramp rather than
from a darkening of Wave, so the greys stay warm instead of turning blue.
"""

[variants.label]
fr = "Mode dragon"
en = "Dragon mode"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#181616"
accent = "#8ba4b0"

[variants.palette]
# backgrounds — dragonBlack0..6, warm charcoal rather than Wave's blue-black
bg_primary = "#181616"
bg_sidebar = "#0d0c0c"
bg_card = "#282727"
bg_card_hover = "#393836"
bg_card_pressed = "#625e5a"
bg_selected = "#393836"
bg_input = "#282727"
bg_progress = "#2d2a2a"

# text — dragonWhite down through the gray ramp
text_primary = "#c5c9c5"
text_secondary = "#a6a69c"
text_muted = "#9e9b93"
text_dim = "#7a8382"
text_dimmer = "#737c73"
text_dimmest = "#625e5a"
text_placeholder = "#7a8382"

# accent — dragonBlue2 and dragonAqua
accent_blue = "#8ba4b0"
accent_icon = "#8ea4a2"
accent_progress = "#8ea4a2"

# buttons
btn_default = "#282727"
btn_hover = "#393836"
btn_pressed = "#625e5a"

# success — dragonGreen, dragonGreen2
success = "#87a987"
success_bg = "#2b332b"
btn_success = "#8a9a7b"
btn_success_hover = "#7c8c6d"
btn_success_pressed = "#6e7e5f"

# warning — dragonYellow
warning = "#c4b28a"
warning_bg = "#46413c"

# error — dragonRed
error = "#c4746e"
error_light = "#d4827c"
error_bg = "#3d2a28"
btn_danger_bg = "#3d2a28"
btn_danger_hover = "#5a3a37"
btn_trash_hover = "#c4746e"
btn_trash_pressed = "#a35c57"

# modal
bg_modal_section = "#181616"
border_subtle = "#282727"
divider = "#282727"
