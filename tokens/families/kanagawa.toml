[[variants]]
key = "journal"
const = "KANAGAWA_DRAGON"  # Rust const name, kept stable for Colony
label_key = "settings_theme_kanagawa_journal"
mode = "light"
notes = """
Colony's own light take on Kanagawa Dragon: warm parchment surfaces, a
slightly darker sidebar, dark brown text and a warm brown accent matched to
the reference screenshot.
"""

[variants.label]
fr = "Mode journal"
en = "Journal mode"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#d5cea3"
accent = "#7a6840"

[variants.palette]
# backgrounds
bg_primary = "#d5cea3"
bg_sidebar = "#c8b98e"
bg_card = "#c8b98e"
bg_card_hover = "#bdae80"
bg_card_pressed = "#b0a070"
bg_selected = "#bdae80"
