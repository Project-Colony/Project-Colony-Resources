bg_input = "#e2e2e2"
bg_progress = "#f0f0f0"

# text
text_primary = "#383a42"
text_secondary = "#4a4c56"
text_muted = "#686a76"
text_dim = "#818387"
text_dimmer = "#a0a1a7"
text_dimmest = "#b8b9bc"
text_placeholder = "#a0a1a7"

# accent
accent_blue = "#4078f2"
accent_icon = "#0184bc"
accent_progress = "#4078f2"

# buttons
btn_default = "#e2e2e2"
btn_hover = "#d4d4d4"
btn_pressed = "#c8c8c8"

# success
success = "#50a14f"
success_bg = "#d0e8d0"
