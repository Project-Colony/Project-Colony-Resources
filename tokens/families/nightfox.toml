# Nightfox — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "nightfox"
order = 16
label_key = "settings_theme_nightfox"
icon = "f0139"  # Nerd Font codepoint

[label]
fr = "Nightfox"
en = "Nightfox"

[[variants]]
key = "nightfox"
const = "NIGHTFOX"  # Rust const name, kept stable for Colony
label_key = "settings_theme_nightfox_nightfox"
mode = "dark"

[variants.label]
fr = "Nightfox"
en = "Nightfox"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#192330"
accent = "#719cd6"

[variants.palette]
# backgrounds
bg_primary = "#192330"
bg_sidebar = "#131a24"
bg_card = "#2b3b51"
