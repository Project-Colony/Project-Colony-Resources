# Monokai Pro — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "monokai"
order = 11
label_key = "settings_theme_monokai"
icon = "f121"  # Nerd Font codepoint

[label]
fr = "Monokai Pro"
en = "Monokai Pro"

[[variants]]
key = "pro"
const = "MONOKAI_PRO"  # Rust const name, kept stable for Colony
label_key = "settings_theme_monokai_pro"
mode = "dark"

[variants.label]
fr = "Pro"
en = "Pro"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#2d2a2e"
accent = "#78dce8"

[variants.palette]
# backgrounds
bg_primary = "#2d2a2e"
bg_sidebar = "#221f22"
bg_card = "#403e41"
bg_card_hover = "#525052"
bg_card_pressed = "#5b595c"
bg_selected = "#403e41"
bg_input = "#403e41"
bg_progress = "#221f22"

# text
text_primary = "#fcfcfa"
text_secondary = "#e0e0de"
text_muted = "#c1c0c0"
text_dim = "#939293"
text_dimmer = "#727072"
text_dimmest = "#5b595c"
text_placeholder = "#727072"

# accent
accent_blue = "#78dce8"
accent_icon = "#ab9df2"
accent_progress = "#78dce8"

# buttons
btn_default = "#403e41"
btn_hover = "#525052"
btn_pressed = "#5b595c"

# success
success = "#a9dc76"
success_bg = "#222820"
btn_success = "#88b860"
btn_success_hover = "#7cac54"
btn_success_pressed = "#70a048"

# warning
warning = "#ffd866"
warning_bg = "#302a20"

# error
error = "#ff6188"
error_light = "#ff8098"
error_bg = "#341e28"
btn_danger_bg = "#341e28"
btn_danger_hover = "#542e38"
btn_trash_hover = "#ff6188"
btn_trash_pressed = "#df5070"

# modal
bg_modal_section = "#2d2a2e"
border_subtle = "#403e41"
divider = "#403e41"

