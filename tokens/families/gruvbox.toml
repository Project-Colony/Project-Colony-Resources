bg = "#282828"
accent = "#83a598"

[variants.palette]
# backgrounds
bg_primary = "#282828"
bg_sidebar = "#1d2021"
bg_card = "#3c3836"
bg_card_hover = "#504945"
bg_card_pressed = "#665c54"
bg_selected = "#504945"
bg_input = "#3c3836"
bg_progress = "#32302f"

# text
