text_muted = "#bdae93"
text_dim = "#a89984"
text_dimmer = "#928374"
text_dimmest = "#7c6f64"
text_placeholder = "#928374"

# accent
accent_blue = "#83a598"
accent_icon = "#83a598"
accent_progress = "#83a598"

# buttons
btn_default = "#3c3836"
btn_hover = "#504945"
btn_pressed = "#665c54"

# success
success = "#b8bb26"
success_bg = "#2a3020"
btn_success = "#689d6a"
btn_success_hover = "#5a8f5c"
btn_success_pressed = "#4c814e"

# warning
