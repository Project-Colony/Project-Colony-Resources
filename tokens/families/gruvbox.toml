# Gruvbox — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "gruvbox"
order = 2
label_key = "settings_theme_gruvbox"
icon = ""  # no icon in the picker

[label]
fr = "Gruvbox"
en = "Gruvbox"

[[variants]]
key = "light"
const = "GRUVBOX_LIGHT"  # Rust const name, kept stable for Colony
label_key = "settings_theme_light"
mode = "light"

[variants.label]
fr = "Mode clair"
en = "Light mode"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#fbf1c7"
accent = "#458588"

[variants.palette]
# backgrounds
bg_primary = "#fbf1c7"
bg_sidebar = "#f2e5bc"
bg_card = "#ebdbb2"
bg_card_hover = "#d5c4a1"
bg_card_pressed = "#bdae93"
bg_selected = "#d5c4a1"
bg_input = "#ebdbb2"
bg_progress = "#f2e5bc"

# text
text_primary = "#3c3836"
text_secondary = "#504945"
text_muted = "#665c54"
text_dim = "#7c6f64"
text_dimmer = "#928374"
text_dimmest = "#a89984"
text_placeholder = "#928374"

# accent
accent_blue = "#458588"
accent_icon = "#458588"
accent_progress = "#458588"

# buttons
btn_default = "#ebdbb2"
btn_hover = "#d5c4a1"
btn_pressed = "#bdae93"

# success
success = "#98971a"
success_bg = "#dde6b0"
btn_success = "#689d6a"
btn_success_hover = "#5a8f5c"
btn_success_pressed = "#4c814e"

# warning
warning = "#d79921"
warning_bg = "#f0e0b0"

# error
error = "#cc241d"
error_light = "#d44040"
error_bg = "#f0c8c8"
btn_danger_bg = "#f0c8c8"
btn_danger_hover = "#e0a8a8"
btn_trash_hover = "#cc241d"
btn_trash_pressed = "#aa1818"

# modal
bg_modal_section = "#fbf1c7"
border_subtle = "#d5c4a1"
divider = "#d5c4a1"

[[variants]]
key = "dark"
const = "GRUVBOX_DARK"  # Rust const name, kept stable for Colony
label_key = "settings_theme_dark_mode"
mode = "dark"

[variants.label]
fr = "Mode sombre"
en = "Dark mode"

# Swatch shown on the picker card in the Settings page.
