# Material — Project Colony theme family
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.

key = "material"
order = 14
label_key = "settings_theme_material"
icon = "f0509"  # Nerd Font codepoint

[label]
fr = "Material"
en = "Material"

[[variants]]
key = "oceanic"
const = "MATERIAL_OCEANIC"  # Rust const name, kept stable for Colony
label_key = "settings_theme_material_oceanic"
mode = "dark"

[variants.label]
fr = "Oceanic"
en = "Oceanic"

# Swatch shown on the picker card in the Settings page.
[variants.swatch]
bg = "#263238"
accent = "#89ddff"

[variants.palette]
# backgrounds
bg_primary = "#263238"
bg_sidebar = "#1e272c"
bg_card = "#2e3c42"
bg_card_hover = "#3a4a52"
bg_card_pressed = "#465862"
bg_selected = "#546e7a"
bg_input = "#2e3c42"
bg_progress = "#1e272c"

# text
text_primary = "#b0bec5"
text_secondary = "#9aaab2"
text_muted = "#849aa4"
text_dim = "#6e8490"
text_dimmer = "#546e7a"
text_dimmest = "#405a64"
text_placeholder = "#546e7a"

# accent
accent_blue = "#89ddff"
accent_icon = "#80cbc4"
accent_progress = "#89ddff"

# buttons
btn_default = "#2e3c42"
btn_hover = "#3a4a52"
btn_pressed = "#465862"

# success
success = "#c3e88d"
success_bg = "#1a3028"
btn_success = "#a0c070"
btn_success_hover = "#94b464"
btn_success_pressed = "#88a858"

# warning
warning = "#ffcb6b"
warning_bg = "#2e2e1e"

# error
error = "#ff5370"
error_light = "#ff7088"
error_bg = "#2e1e22"
btn_danger_bg = "#2e1e22"
btn_danger_hover = "#4e2e32"
btn_trash_hover = "#ff5370"
btn_trash_pressed = "#df4058"

# modal
bg_modal_section = "#263238"
border_subtle = "#2e3c42"
divider = "#2e3c42"

