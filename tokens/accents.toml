# Accent overrides — Project Colony
#
# Source of truth. Edit here, then run `cargo run -p colony-tokens -- generate`.
# Never edit anything under generated/ by hand.
#
# These eight colours are palette-independent: they are what the user can pick in
# Settings → Appearance → Colors to override the active theme's own accent.
# "Auto" is not listed here — it is the absence of an override, i.e. fall back to
# the theme's `accent_blue`.
#
# ORDER IS LOAD-BEARING. Colony derives each installed app's identity tint by
# bucketing a hash of the app's NAME into this list. Reordering it, or inserting
# an entry anywhere but the end, silently re-colours every app icon on every
# user's machine. Append only.

[[accents]]
key = "red"
label_key = "settings_accent_red"
color = "#e05555"

[accents.label]
fr = "Rouge"
en = "Red"

