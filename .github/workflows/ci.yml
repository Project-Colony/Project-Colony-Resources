name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tokens:
    name: tokens and generated artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on every GitHub-hosted runner image: no third-party action to
      # pin, and nothing for Dependabot to lose track of.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

      # The `fonts` feature is on by default. A program that ships the font
      # files itself turns it off, so that build has to keep compiling too.
      - name: colony-ui without the embedded fonts
        run: cargo clippy -p colony-ui --no-default-features --all-targets -- -D warnings

      # docs.rs is where programs read the crate's API; a broken link there is a
      # broken page.
      - name: colony-ui docs
        run: cargo doc -p colony-ui --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # Proves the palettes still round-trip against the snapshot of Colony's
      # theme.rs, that both locales stay in step, and that text stays legible.
      - name: Tests
        run: cargo test --all

      # Fails if someone edited generated/ by hand or forgot to regenerate.
      - name: generated/ is in sync with tokens/
        run: cargo run -p colony-tokens -- check

      # colony-ui embeds files that must live INSIDE the crate: cargo package
      # only ships the crate root, so anything that drifts back outside it would
      # publish a crate that does not compile for whoever downloads it. This
      # builds the crate from its own tarball, which is the only way to catch it.
      - name: colony-ui is publishable
        run: cargo package -p colony-ui

  # rust-version in Cargo.toml is a promise to every program that depends on
  # colony-ui. Without this job nothing ever builds on it, and it drifts.
  #
  # RUSTUP_TOOLCHAIN is what pins the cargo invocations: it outranks both the
  # runner's rustup default and any rust-toolchain.toml. The rustc check makes
  # a pin that silently stopped working fail loudly.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared floor
        run: |
          rustc --version | grep -q "^rustc ${RUSTUP_TOOLCHAIN}[. ]" \
            || { echo "::error::expected rustc ${RUSTUP_TOOLCHAIN}, got $(rustc --version)"; exit 1; }
          cargo check --locked --all-targets

  # The job above runs every test on Linux. colony-ui's paths module takes other
  # branches on Windows and macOS (the Windows cache directory must not be the
  # config directory), and those tests only run on those platforms.
  colony-ui:
    name: colony-ui tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Tests
        run: cargo test -p colony-ui --locked

  # Dependabot moves the pins in .github/workflows/ but never reads templates/,
  # and programs copy their release workflow from templates/. Every `uses:` in
  # both must be a full commit SHA with its version in a trailing comment, and
  # an action pinned in two places must be pinned at the same commit, so a
  # Dependabot bump fails here until the template is bumped in the same PR.
  # The template's call to the shared workflow names "organisation pin"
  # instead of a version: it moves only as design/releases.md describes.
  pins:
    name: action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every action is pinned, at one commit everywhere
        run: |
          grep -nE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/*.yml templates/*.yml \
            | awk '
                {
                  split($1, loc, ":"); file = loc[1]; line = loc[2]
                  match($0, /uses:[[:space:]]*[^[:space:]#]+/)
                  ref = substr($0, RSTART, RLENGTH); sub(/uses:[[:space:]]*/, "", ref)
                  comment = $0; sub(/^[^#]*/, "", comment)
                }
                ref ~ /^\.\// { next }
                {
                  at = index(ref, "@"); action = substr(ref, 1, at - 1); sha = substr(ref, at + 1)
                }
                at == 0 || length(sha) != 40 || sha ~ /[^0-9a-f]/ {
                  printf "::error file=%s,line=%s::%s is not pinned to a full commit SHA\n", file, line, ref
                  bad = 1; next
                }
                comment !~ /^#[[:space:]]*v[0-9]/ && action !~ /^Project-Colony\/Project-Colony-Resources\// {
                  printf "::error file=%s,line=%s::%s needs its version in a trailing comment (# vX.Y.Z)\n", file, line, action
                  bad = 1
                }
                action in first && pin[action] != sha {
                  printf "::error file=%s,line=%s::%s is pinned at %s here but at %s in %s\n", file, line, action, sha, pin[action], first[action]
                  bad = 1; next
                }
                !(action in first) { pin[action] = sha; first[action] = file ":" line }
                END { exit bad }
              '
          echo "every action is pinned to one commit"
